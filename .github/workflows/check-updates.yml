name: Check Trophi.ai Updates

on:
  schedule:
    - cron: "0 8 * * *"   # daily at 08:00 UTC — edit to taste
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated state file

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update checker
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python check_updates.py

      - name: Commit updated state file (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_update.json
          git diff --cached --quiet || git commit -m "Update last-seen patch note"
          git push
